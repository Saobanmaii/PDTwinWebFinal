spring.application.name=pdtwin-backend

# Mật khẩu DB, khóa JWT, link camera nằm trong application-secret.properties (không commit).
# Xem application-secret.properties.example. Có thể dùng biến môi trường DB_PASSWORD / JWT_SECRET thay thế.
spring.config.import=optional:classpath:application-secret.properties

spring.datasource.url=jdbc:mysql://localhost:3306/pdtwin?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiration=86400000

app.upload.dir=uploads/

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.port=8080
